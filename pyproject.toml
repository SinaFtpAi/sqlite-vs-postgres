[project]
name = "sqlite-vs-postgres"
version = "0.1.0"
description = "SQLite vs PostgreSQL on one machine: a fair, repeatable Python benchmark"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sina Fathpour" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic>=2",
  "pyyaml",
  "matplotlib>=3.9",
]

[project.urls]
Repository = "https://github.com/SinaFtpAi/sqlite-vs-postgres"

[project.scripts]
dbbench = "dbbench.cli:main"

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbbench"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "CPY001", # no per-file copyright headers in a personal project
  "COM812", # conflicts with the formatter
  "ISC001", # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "D", "ANN401", "SLF001", "INP001"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
